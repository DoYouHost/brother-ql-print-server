[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "label-printer"
description = "Print server for Brother QL label printers, made for a Raspberry Pi"
requires-python = ">=3.11"
dynamic = ["version", "dependencies"]

[project.scripts]
label-printer = "label_printer.__main__:main"

[tool.setuptools]
packages = ["label_printer"]

[tool.setuptools.package-data]
label_printer = ["web/*", "web/fonts/*"]

[tool.setuptools.dynamic]
version = { attr = "label_printer.__version__" }
dependencies = { file = ["requirements.txt"] }
